name: Verify

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'spec/**'
  pull_request:
  workflow_dispatch:
    inputs:
      audit:
        description: Run full performance and coverage measurements
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.13', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - uses: actions/checkout@v7
        with:
          repository: componenta/di
          ref: fix/callback-dependency-baseline-2026-11-26
          path: .dependencies/di
      - name: Select the DI 6 integration branch
        run: php tools/development-composer.php
      - run: COMPOSER=.composer-development.json composer update --no-interaction --prefer-dist
        id: install
      - run: composer test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: composer analyse
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: composer bench:smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Full performance measurement
        if: ${{ success() && (inputs.audit == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audit]'))) }}
        run: composer bench
      - name: Enable coverage driver after performance measurement
        if: ${{ success() && (inputs.audit == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audit]'))) }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - name: Measure test coverage
        if: ${{ success() && (inputs.audit == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audit]'))) }}
        run: composer test:coverage
